name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: S-Cyber-PM-Integrado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: S-Cyber-PM-Integrado/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt ruff
      - name: Lint (erros reais, pyflakes)
        run: python -m ruff check --select E9,F .
      - name: Testes
        run: python -m unittest discover -s tests -v
